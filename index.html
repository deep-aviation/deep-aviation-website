<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Aviation Private Limited</title>
  <style>
    body {
      font-family: 'Space Grotesk', 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      color: #333;
    }
    header {
      background-color: #1f1f1f;
      color: #fff;
      padding: 2rem 0;
      text-align: center;
    }
    main {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 20px;
    }
    .hero {
      text-align: center;
      margin-bottom: 3rem;
    }
    .products {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 3rem;
    }
    .product-card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 28%;
      text-align: center;
    }
    .video-showcase {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 3rem;
    }
    .video-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      margin-top: 20px;
    }
    video {
      width: 100%;
      max-width: 700px;
      border-radius: 4px;
      background-color: #000;
    }
    .contact-form {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .contact-form form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .contact-form input, .contact-form textarea {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
    }
    .contact-form button {
      background-color: #1f1f1f;
      color: #fff;
      border: none;
      padding: 12px 20px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 16px;
    }
    .contact-form button:hover {
      background-color: #3d3d3d;
    }
    footer {
      text-align: center;
      padding: 1.5rem 0;
      background-color: #1f1f1f;
      color: #fff;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Deep Aviation Private Limited</h1>
  </header>

  <main>
    <section class="hero">
      <h2>Welcome</h2>
      <p>Supporting aerospace manufacturing design and manufacturing needs with precision and efficiency.</p>
    </section>

    <section class="video-showcase">
      <h2 style="text-align: center;">Engine Assembly Showcase</h2>
      <div class="video-container">
        <video controls>
          <source src="video1.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <video controls>
          <source src="video2.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </section>

    <section class="products">
      <div class="product-card">
        <h3>MTJ 1500</h3>
      </div>
      <div class="product-card">
        <h3>Shafts</h3>
      </div>
      <div class="product-card">
        <h3>Trolleys</h3>
      </div>
    </section>

    <section class="contact-form">
      <h2>Contact Us</h2>
      <form action="#" method="POST">
        <div>
          <label for="name">Your name (Required)</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div>
          <label for="email">Email (Required)</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div>
          <label for="company">Company name (Required)</label>
          <input type="text" id="company" name="company" required>
        </div>
        <div>
          <label for="requirement">Requirement (Required)</label>
          <textarea id="requirement" name="requirement" rows="4" required></textarea>
        </div>
        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Deep Aviation Private Limited. All rights reserved.</p>
  </footer>

</body>
</html>
